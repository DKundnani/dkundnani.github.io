# Refreshes the publication figures on the home page, monthly.
#
# The script prefers Google Scholar and falls back to OpenAlex. Scholar blocks
# datacenter traffic, so from GitHub's runners the fallback is what usually
# succeeds — and the script refuses to overwrite Scholar figures with lower
# OpenAlex ones. In practice that means this job keeps the publication count
# fresh, while the citation and h-index figures are refreshed whenever you run
# the same script locally:
#
#     python3 scripts/update_metrics.py
name: Update publication metrics

on:
  schedule:
    - cron: "0 6 1 * *"       # 06:00 UTC on the 1st of each month
  workflow_dispatch:           # ...or run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh metrics
        run: python3 scripts/update_metrics.py

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain data/metrics.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/metrics.json
            git commit -m "Update publication metrics"
            git push
          else
            echo "nothing to commit"
          fi
